spring:
  application:
    name: progresshub

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/oauth/callback}
  token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

gemini:
  api-key: ${GEMINI_API_KEY:}